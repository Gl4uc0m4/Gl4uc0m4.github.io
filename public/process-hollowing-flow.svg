<svg width="100%" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Process hollowing execution flow</title>
<desc>Flowchart of the four-step process hollowing technique: create a suspended process, unmap the original image via NtUnmapViewOfSection, map a malicious image into the address space, then resume the thread to execute it.</desc>
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="20" y="60" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="90" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">Create process</text>
<text x="90" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">suspended</text>

<line x1="160" y1="88" x2="192" y2="88" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow3)"/>

<rect x="194" y="60" width="150" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="269" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#4A1B0C">Unmap image</text>
<text x="269" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">NtUnmapViewOfSection</text>

<line x1="344" y1="88" x2="376" y2="88" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow3)"/>

<rect x="378" y="60" width="150" height="56" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
<text x="453" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#501313">Map new image</text>
<text x="453" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#791F1F">malicious payload</text>

<line x1="528" y1="88" x2="560" y2="88" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow3)"/>

<rect x="562" y="60" width="100" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="612" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">Resume</text>
<text x="612" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">thread</text>

<text x="340" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">VAD-level tell: expected image VAD is missing or replaced; entry point mismatch</text>
</svg>
