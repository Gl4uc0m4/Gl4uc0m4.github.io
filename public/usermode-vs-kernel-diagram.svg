<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>User-mode visibility layer versus kernel-tracked ground truth</title>
<desc>Structural diagram showing the user-mode layer (PEB, loader lists, VirtualQueryEx, EnumProcessModules) as a manipulable visibility surface sitting above the kernel memory manager, which maintains the authoritative VAD AVL tree that user-mode evasion techniques cannot alter.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- User-mode container -->
<rect x="60" y="40" width="560" height="140" rx="16" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="80" y="64" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">User mode</text>
<text x="80" y="82" font-family="sans-serif" font-size="12" fill="#993C1D">Visibility layer — can be manipulated</text>

<rect x="80" y="96" width="150" height="60" rx="8" fill="#FFFFFF" stroke="#D85A30" stroke-width="0.5"/>
<text x="155" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#4A1B0C">PEB loader lists</text>
<text x="155" y="138" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">Can be unlinked</text>

<rect x="250" y="96" width="150" height="60" rx="8" fill="#FFFFFF" stroke="#D85A30" stroke-width="0.5"/>
<text x="325" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#4A1B0C">VirtualQueryEx</text>
<text x="325" y="138" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">Reflects tables, not intent</text>

<rect x="420" y="96" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#D85A30" stroke-width="0.5"/>
<text x="510" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#4A1B0C">EnumProcessModules</text>
<text x="510" y="138" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">Depends on loader visibility</text>

<!-- Boundary line -->
<line x1="60" y1="200" x2="620" y2="200" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
<text x="340" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">memory manager boundary — evasion techniques cannot cross this line</text>

<!-- Kernel container -->
<rect x="60" y="220" width="560" height="150" rx="16" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="80" y="244" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Kernel mode</text>
<text x="80" y="262" font-family="sans-serif" font-size="12" fill="#0F6E56">Ground truth — authoritative bookkeeping</text>

<rect x="130" y="278" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="0.5"/>
<text x="230" y="300" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#04342C">Memory manager (Mm)</text>
<text x="230" y="320" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Owns allocation metadata</text>

<rect x="360" y="278" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="0.5"/>
<text x="460" y="300" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#04342C">VadRoot AVL tree</text>
<text x="460" y="320" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Every allocated range tracked</text>

<line x1="330" y1="313" x2="358" y2="313" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>

<!-- Blocked evasion arrow -->
<path d="M155 156 L155 218" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="163" y="192" font-family="sans-serif" font-size="12" fill="#E24B4A">blocked</text>
</svg>
