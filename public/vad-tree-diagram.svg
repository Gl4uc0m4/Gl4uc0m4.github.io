<svg width="100%" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>EPROCESS to VadRoot AVL tree of VAD nodes</title>
<desc>Diagram showing EPROCESS pointing to VadRoot, which is the root of a self-balancing AVL tree of _MMVAD nodes, each describing a memory range with StartingVpn, EndingVpn, VadFlags and optional ControlArea.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- EPROCESS box -->
<rect x="270" y="20" width="140" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">EPROCESS</text>

<!-- Arrow to VadRoot -->
<line x1="340" y1="64" x2="340" y2="100" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="352" y="86" font-family="sans-serif" font-size="12" fill="#5F5E5A">VadRoot</text>

<!-- Root VAD node -->
<rect x="255" y="104" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="340" y="124" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">_MMVAD (root)</text>
<text x="340" y="144" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">StartingVpn / EndingVpn</text>

<!-- Connectors to children -->
<path d="M300 160 L170 210" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M380 160 L510 210" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Left child -->
<rect x="90" y="212" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="170" y="232" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">_MMVAD</text>
<text x="170" y="252" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Type: Image (PE-backed)</text>

<!-- Right child -->
<rect x="430" y="212" width="160" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="510" y="232" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">_MMVAD</text>
<text x="510" y="252" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">Type: Private, no backing</text>

<!-- Grandchildren of right node (suspicious leaf) -->
<path d="M470 268 L400 320" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M550 268 L590 320" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="300" y="322" width="180" height="70" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
<text x="390" y="340" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#501313">_MMVAD (leaf)</text>
<text x="390" y="358" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#791F1F">Protection: RWX</text>
<text x="390" y="376" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#791F1F">ControlArea: none</text>

<rect x="510" y="322" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="585" y="342" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">_MMVAD</text>
<text x="585" y="362" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Type: Mapped (file)</text>

<!-- Caption -->
<text x="340" y="420" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#E24B4A" font-weight="500">Red leaf: private + executable + no ControlArea — classic reflective-load signature</text>
</svg>
